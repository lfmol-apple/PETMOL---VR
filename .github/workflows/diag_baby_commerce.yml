name: Diagnose pet commerce GTINs

# Read-only: mostra o GTIN do plano de ração e do histórico de
# parasite_control_records de um pet, e cruza cada um contra o catálogo
# Awin/Cobasi sincronizado — ver deploy/scripts/diag_baby_commerce.py.

on:
  workflow_dispatch:
    inputs:
      pet_name:
        description: "Nome do pet (ou deixe vazio e use pet_id)"
        required: false
        default: "Baby"
      pet_id:
        description: "ID exato do pet (opcional, desambigua)"
        required: false
        default: ""

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Upload script to VPS
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          VPS_PORT="${VPS_PORT:-22}"
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_IP" >> ~/.ssh/known_hosts 2>/dev/null || true
          scp -i ~/.ssh/deploy_key -o Port="$VPS_PORT" -o StrictHostKeyChecking=no \
            deploy/scripts/diag_baby_commerce.py \
            "$VPS_USER@$VPS_IP:/tmp/diag_baby_commerce.py"

      - name: Run on VPS
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PET_NAME: ${{ github.event.inputs.pet_name }}
          PET_ID: ${{ github.event.inputs.pet_id }}
        run: |
          VPS_PORT="${VPS_PORT:-22}"
          SSH="ssh -i ~/.ssh/deploy_key -o Port=$VPS_PORT -o StrictHostKeyChecking=no $VPS_USER@$VPS_IP"

          ARGS=""
          [ -n "$PET_ID" ] && ARGS="--pet-id \"$PET_ID\"" || ARGS="--pet-name \"$PET_NAME\""

          $SSH "
            cd /opt/petmol/current/services/price-service
            .venv/bin/python /tmp/diag_baby_commerce.py $ARGS
          "
