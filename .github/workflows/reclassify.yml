name: Reclassificar documentos de pet

on:
  workflow_dispatch:
    inputs:
      pet_name:
        description: "Nome do pet (ex: Baby)"
        required: true
        default: "Baby"
      dry_run:
        description: "Dry-run? (true = só mostra, não salva)"
        required: false
        default: "false"

jobs:
  reclassify:
    name: Reclassificar — ${{ github.event.inputs.pet_name }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Executar reclassificação no VPS via SSH
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PET_NAME: ${{ github.event.inputs.pet_name }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          VPS_PORT="${VPS_PORT:-22}"
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH="ssh -i ~/.ssh/deploy_key -o Port=$VPS_PORT -o StrictHostKeyChecking=no -o ConnectTimeout=30 $VPS_USER@$VPS_IP"

          # Copia o script para o VPS
          scp -i ~/.ssh/deploy_key -o Port="$VPS_PORT" -o StrictHostKeyChecking=no \
            deploy/scripts/reclassify_pet_docs.py \
            "$VPS_USER@$VPS_IP:/opt/petmol/reclassify_pet_docs.py"

          # Executa no contexto do projeto
          DRY_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then DRY_FLAG="--dry-run"; fi

          $SSH bash -c "
            cd /opt/petmol/app/services/price-service
            source .venv/bin/activate
            set -a; [ -f .env ] && source .env; set +a
            cd /opt/petmol/app
            python /opt/petmol/reclassify_pet_docs.py --pet '$PET_NAME' $DRY_FLAG
          "
