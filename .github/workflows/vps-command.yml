name: VPS Command

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Shell command to run on the VPS as the deploy SSH user"
        required: true
      timeout_seconds:
        description: "Remote command timeout in seconds"
        required: false
        default: "300"
      stage_ml_secret:
        description: "If 'true', also stage MERCADOLIVRE_CLIENT_SECRET as a 600-perm file on the VPS before running `command`; its path is exported as $ML_SECRET_FILE for the command to read. The secret is never embedded in `command` text (which is echoed unmasked in this workflow's own logs) — this is the only supported way for `command` to use it. Defaults to 'false' and changes nothing for any other use of this workflow."
        required: false
        default: "false"
      download_path:
        description: "Optional: an absolute path on the VPS that `command` produced. If set, it's scp'd back and uploaded as a build artifact (download with `gh run download`) instead of ever going through this workflow's text log — GitHub's own secret-masking scans and replaces any log-text substring that happens to coincidentally match a registered secret, which silently corrupts binary/bulk data (confirmed today on a large CSV export unrelated to any real secret). Artifacts aren't scanned this way, so this is the only safe path for pulling back non-trivial output."
        required: false
        default: ""

jobs:
  run:
    name: Run command on VPS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Execute command over SSH
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_COMMAND: ${{ github.event.inputs.command }}
          REMOTE_TIMEOUT: ${{ github.event.inputs.timeout_seconds }}
          STAGE_ML_SECRET: ${{ github.event.inputs.stage_ml_secret }}
          MERCADOLIVRE_CLIENT_SECRET: ${{ secrets.MERCADOLIVRE_CLIENT_SECRET }}
          DOWNLOAD_PATH: ${{ github.event.inputs.download_path }}
        run: |
          set -euo pipefail
          VPS_PORT="${VPS_PORT:-22}"
          REMOTE_TIMEOUT="${REMOTE_TIMEOUT:-300}"
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH_OPTS="-i ~/.ssh/deploy_key -o Port=$VPS_PORT -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o BatchMode=yes -o ServerAliveInterval=10 -o ServerAliveCountMax=2"
          SSH="ssh $SSH_OPTS $VPS_USER@$VPS_IP"

          # Only retry on 255 — OpenSSH's own "the connection itself failed"
          # exit code (refused/timeout/DNS/etc). Any other exit code means
          # SSH connected fine and the REMOTE command ran and returned that
          # status on its own — retrying in that case just re-runs a command
          # that already executed (and whose staged script file is now
          # gone), silently masking the real failure for up to 5 minutes.
          # (Confirmed hitting exactly this today: a remote script under
          # `set -e` legitimately exited non-zero mid-script, and the old
          # blind retry loop mistook that for "SSH not ready" instead of
          # surfacing it.)
          ssh_retry() {
            local max_wait=300 elapsed=0 delay=10 status
            while true; do
              $SSH "$@"
              status=$?
              [ "$status" -ne 255 ] && return "$status"
              elapsed=$((elapsed + delay))
              [ "$elapsed" -ge "$max_wait" ] && { echo "SSH did not become ready after ${max_wait}s"; return 255; }
              echo "SSH connection itself failed (255); retrying in ${delay}s (${elapsed}/${max_wait}s)"
              sleep "$delay"
            done
          }

          scp_retry() {
            local max_wait=300 elapsed=0 delay=10 status
            while true; do
              scp $SSH_OPTS "$@"
              status=$?
              [ "$status" -ne 255 ] && return "$status"
              elapsed=$((elapsed + delay))
              [ "$elapsed" -ge "$max_wait" ] && { echo "SCP did not become ready after ${max_wait}s"; return 255; }
              echo "SCP connection itself failed (255); retrying in ${delay}s (${elapsed}/${max_wait}s)"
              sleep "$delay"
            done
          }

          REMOTE_SECRET_FILE=""
          if [ "$STAGE_ML_SECRET" = "true" ]; then
            if [ -z "${MERCADOLIVRE_CLIENT_SECRET:-}" ]; then
              echo "stage_ml_secret=true but MERCADOLIVRE_CLIENT_SECRET repo secret is not set — aborting without touching the VPS."
              exit 1
            fi
            REMOTE_SECRET_FILE="/tmp/vps-command-${GITHUB_RUN_ID}-ml-secret"
            printf '%s' "$MERCADOLIVRE_CLIENT_SECRET" > /tmp/ml-secret
            chmod 600 /tmp/ml-secret
            scp_retry /tmp/ml-secret "$VPS_USER@$VPS_IP:${REMOTE_SECRET_FILE}"
            rm -f /tmp/ml-secret
            ssh_retry "chmod 600 '${REMOTE_SECRET_FILE}'"
          fi

          printf '%s' "$VPS_COMMAND" > /tmp/vps-command.sh
          scp_retry /tmp/vps-command.sh "$VPS_USER@$VPS_IP:/tmp/vps-command-${GITHUB_RUN_ID}.sh"

          set +e
          ssh_retry "chmod 700 /tmp/vps-command-${GITHUB_RUN_ID}.sh && timeout '$REMOTE_TIMEOUT' env ML_SECRET_FILE='${REMOTE_SECRET_FILE}' bash /tmp/vps-command-${GITHUB_RUN_ID}.sh; status=\$?; rm -f /tmp/vps-command-${GITHUB_RUN_ID}.sh; exit \$status"
          STATUS=$?
          set -e

          if [ -n "$REMOTE_SECRET_FILE" ]; then
            ssh_retry "shred -u '${REMOTE_SECRET_FILE}' 2>/dev/null || rm -f '${REMOTE_SECRET_FILE}'" || true
          fi

          if [ "$STATUS" -eq 0 ] && [ -n "$DOWNLOAD_PATH" ]; then
            scp_retry "$VPS_USER@$VPS_IP:${DOWNLOAD_PATH}" ./downloaded_file
            echo "Downloaded ${DOWNLOAD_PATH} -> ./downloaded_file ($(wc -c < ./downloaded_file) bytes)"
          fi

          exit $STATUS
      - name: Upload downloaded file as artifact
        if: ${{ github.event.inputs.download_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: vps-command-download
          path: downloaded_file
          if-no-files-found: warn
          retention-days: 7
