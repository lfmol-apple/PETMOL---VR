name: Deploy → VPS (atomic releases)

# The official production deploy path (see docs/DEPLOYMENT.md). Auto-triggers
# after CI finishes packaging a release on main; can also be run manually for
# a specific already-packaged SHA (e.g. to redeploy an older commit).
# deploy.yml (the legacy SSH + in-place rsync/build pipeline) is retired from
# the automatic path as of the same change that added this trigger — it's
# workflow_dispatch-only now, kept only as a manual emergency fallback. Do not
# re-enable its automatic trigger alongside this one: both writing to the
# same VPS paths on the same push is what atomic releases exist to prevent.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to deploy (must have a successful CI run on main with a packaged artifact). Leave empty to deploy the latest.'
        required: false
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-vps-atomic
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Activate release on petmol.com.br
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Resolve SHA to deploy
        id: resolve_sha
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ github.event.inputs.sha }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          SHA="${INPUT_SHA:-$WORKFLOW_RUN_SHA}"
          if [ -z "$SHA" ]; then
            # Manual dispatch with no sha given — deploy the latest successful
            # CI run on main.
            SHA=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --branch main --status success --json headSha --jq '.[0].headSha')
          fi
          [ -n "$SHA" ] || { echo "Could not resolve a SHA to deploy."; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_sha.outputs.sha }}
          fetch-depth: 0

      - name: Detect whether VPS deploy is needed
        id: changed_files
        env:
          SHA: ${{ steps.resolve_sha.outputs.sha }}
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # Opcional: chave de host da VPS pinada (known_hosts confiável).
          # Sem ela, cai no ssh-keyscan (TOFU). Ver HUMAN ACTION no relatório RC1.
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          # BUG FIXED HERE (14/08/2026): this used to diff only the single
          # tip commit (`git diff-tree` on $SHA alone) instead of everything
          # that changed since what's actually live. A push that bundles
          # several commits where the LAST one happens to be docs-only made
          # this wrongly conclude "only docs changed" and skip activation —
          # even when earlier commits in the very same push had real code.
          # (Caught 14/08/2026: the Amazon/Shopee affiliate work — 5 code
          # commits + 1 trailing docs commit — never made it to the VPS
          # because of exactly this.) Fix: diff against the SHA that's
          # CURRENTLY deployed (read straight off the VPS's `current`
          # symlink), never against just the new push's tip commit.
          VPS_PORT="${VPS_PORT:-22}"
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$VPS_HOST_KEY" ]; then
            printf '%s\n' "$VPS_HOST_KEY" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$VPS_PORT" -H "$VPS_IP" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi
          SSH="ssh -i ~/.ssh/deploy_key -o Port=$VPS_PORT -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o BatchMode=yes $VPS_USER@$VPS_IP"

          DEPLOYED_SHA="$($SSH 'basename "$(readlink -f /opt/petmol/current)"' 2>/dev/null || true)"
          echo "Currently deployed SHA on VPS: ${DEPLOYED_SHA:-<unknown>}"

          if [ -n "$DEPLOYED_SHA" ] && git cat-file -e "$DEPLOYED_SHA" 2>/dev/null; then
            CHANGED_FILES="$(git diff --no-commit-id --name-only "$DEPLOYED_SHA" "$SHA")"
          else
            echo "Could not resolve the currently-deployed SHA (or it's not in this checkout's history) — never skip in this case, safe default is to activate."
            CHANGED_FILES="$SHA"
          fi
          printf '%s\n' "$CHANGED_FILES"

          if [ -z "$CHANGED_FILES" ]; then
            echo "skip_vps=false" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$CHANGED_FILES" | grep -Ev '^($|docs/|CLAUDE_HANDOFF_DEPLOY\.md$|README\.md$|.*\.md$|\.github/)'; then
            echo "skip_vps=false" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs/workflow files changed since the deployed SHA; skipping VPS activation."
            echo "skip_vps=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Public health check when VPS deploy is skipped
        if: steps.changed_files.outputs.skip_vps == 'true'
        run: |
          STATUS=$(curl -sL -o /dev/null -w "%{http_code}" https://petmol.com.br/api/health)
          if [[ "$STATUS" =~ ^(200|301|302|307|308)$ ]]; then
            echo "No VPS deploy needed — API responding $STATUS"
          else
            echo "Health check failed — HTTP $STATUS"
            exit 1
          fi

      - name: Find the CI run that packaged this SHA
        id: find_run
        if: steps.changed_files.outputs.skip_vps != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve_sha.outputs.sha }}
        run: |
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$SHA" --status success --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then
            echo "No successful CI run found for $SHA — nothing to deploy."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download packaged artifact from that run
        if: steps.changed_files.outputs.skip_vps != 'true'
        uses: actions/download-artifact@v4
        with:
          name: petmol-release-${{ steps.resolve_sha.outputs.sha }}
          run-id: ${{ steps.find_run.outputs.run_id }}
          github-token: ${{ github.token }}
          path: /tmp/release-artifact

      - name: Upload artifact and activate on VPS
        if: steps.changed_files.outputs.skip_vps != 'true'
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # Opcional: chave de host da VPS pinada (known_hosts confiável).
          # Sem ela, cai no ssh-keyscan (TOFU). Ver HUMAN ACTION no relatório RC1.
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          SHA: ${{ steps.resolve_sha.outputs.sha }}
        run: |
          VPS_PORT="${VPS_PORT:-22}"
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$VPS_HOST_KEY" ]; then
            printf '%s\n' "$VPS_HOST_KEY" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$VPS_PORT" -H "$VPS_IP" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi

          SSH_OPTS="-i ~/.ssh/deploy_key -o Port=$VPS_PORT -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o BatchMode=yes -o ServerAliveInterval=10 -o ServerAliveCountMax=2"
          SSH="ssh $SSH_OPTS $VPS_USER@$VPS_IP"
          SCP="scp $SSH_OPTS"

          TARBALL="/tmp/release-artifact/petmol-${SHA}.tar.gz"
          if [ ! -f "$TARBALL" ]; then
            echo "Downloaded artifact missing: $TARBALL"
            exit 1
          fi

          # Retries here são só pra flakiness de conexão/upload — o
          # activate.sh, uma vez rodando, roda exatamente uma vez (lock
          # próprio). Nenhum retry envolve o comando de ativação em si.
          # max_wait 300s: o SSH do VPS (Hostinger, ssh.socket do Ubuntu 24)
          # já travou por >3min sob carga — ver deploy/release/repair_ssh_*.
          retry() {
            local max_wait=300 elapsed=0 delay=10
            until "$@"; do
              elapsed=$((elapsed + delay))
              [ "$elapsed" -ge "$max_wait" ] && { echo "comando não completou após ${max_wait}s: $*"; return 1; }
              echo "SSH/upload não pronto; nova tentativa em ${delay}s (${elapsed}/${max_wait}s)"
              sleep "$delay"
            done
          }

          retry $SSH "mkdir -p /opt/petmol/incoming"
          retry $SCP "$TARBALL" "$VPS_USER@$VPS_IP:/opt/petmol/incoming/petmol-${SHA}.tar.gz"

          $SSH "tar -xzOf /opt/petmol/incoming/petmol-${SHA}.tar.gz deploy/release/activate.sh > /tmp/activate-${SHA}.sh && \
                PETMOL_DEPLOY_SHA='${SHA}' bash /tmp/activate-${SHA}.sh /opt/petmol/incoming/petmol-${SHA}.tar.gz && \
                rm -f /tmp/activate-${SHA}.sh /opt/petmol/incoming/petmol-${SHA}.tar.gz"

      - name: External health check
        if: steps.changed_files.outputs.skip_vps != 'true'
        run: |
          sleep 5
          STATUS=$(curl -sL -o /dev/null -w "%{http_code}" https://petmol.com.br/api/health)
          if [[ "$STATUS" =~ ^(200|301|302|307|308)$ ]]; then
            echo "✅ Deploy successful — API responding $STATUS"
          else
            echo "❌ External health check failed — HTTP $STATUS"
            exit 1
          fi
