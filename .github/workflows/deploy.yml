name: Deploy → VPS

on:
  workflow_dispatch:  # manual trigger no GitHub — bypasses the CI gate below on purpose
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Nothing prevented two deploy runs from executing on the VPS at the same
# time (e.g. a manual dispatch overlapping a workflow_run-triggered one) —
# both write into the same node_modules/.next on disk, and a concurrent
# `npm ci` + `next build` colliding there corrupted the build (saw both a
# missing-Next.js-internal-module error and a bogus "Cannot find name
# 'localStorage'" TS error from the same commit that built cleanly in CI).
# Queue instead of racing; never cancel one mid-deploy since that would
# leave the VPS with a half-applied release.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    name: Deploy to petmol.com.br
    runs-on: ubuntu-latest
    # Previously this fired on every push to main in parallel with CI, so a
    # commit whose tests failed could still finish deploying before CI
    # reported it — CI and deploy raced instead of gating each other. Now
    # deploy only starts once CI has finished, and only proceeds if it
    # actually passed (workflow_dispatch still bypasses this for manual/
    # emergency deploys).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # A VPS reboot mid-deploy killed the SSH connection without GitHub Actions
    # ever finding out — the run just sat "in_progress" indefinitely, and
    # since concurrency below never cancels, it silently blocked every
    # subsequent deploy from even starting until someone noticed and
    # cancelled it by hand. Keep a finite timeout, but leave room for SSH
    # banner timeouts/retries when port 22 is temporarily saturated.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # Pin to the exact commit CI validated, not whatever main's tip is
          # by the time this job starts.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Create deployment package
        run: |
          zip -r /tmp/PETMOL.zip . \
            --exclude "*.git*" \
            --exclude "node_modules/*" \
            --exclude ".next/*" \
            --exclude "__pycache__/*" \
            --exclude "*.pyc" \
            --exclude ".venv/*" \
            --exclude "uploads/*"
          echo "Package size: $(du -sh /tmp/PETMOL.zip | cut -f1)"

      - name: Upload and deploy via SSH
        id: ssh_deploy
        continue-on-error: true
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GIT_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o BatchMode=yes -o ServerAliveInterval=10 -o ServerAliveCountMax=2"
          SSH="ssh $SSH_OPTS $VPS_USER@$VPS_IP"
          SCP="scp $SSH_OPTS"

          ssh_retry() {
            local max_wait=480
            local elapsed=0
            local delay=10
            until $SSH "$@"; do
              elapsed=$((elapsed + delay))
              if [ "$elapsed" -ge "$max_wait" ]; then
                echo "SSH did not become ready after ${max_wait}s"
                return 1
              fi
              echo "SSH not ready yet; retrying in ${delay}s (${elapsed}/${max_wait}s)"
              sleep "$delay"
              if [ "$delay" -lt 40 ]; then
                delay=$((delay + 10))
              fi
            done
          }

          scp_retry() {
            local max_wait=480
            local elapsed=0
            local delay=10
            until $SCP "$@"; do
              elapsed=$((elapsed + delay))
              if [ "$elapsed" -ge "$max_wait" ]; then
                echo "SCP did not succeed after ${max_wait}s"
                return 1
              fi
              echo "SCP not ready yet; retrying in ${delay}s (${elapsed}/${max_wait}s)"
              sleep "$delay"
              if [ "$delay" -lt 40 ]; then
                delay=$((delay + 10))
              fi
            done
          }

          ssh_stdin_retry() {
            local stdin_file="$1"
            shift
            local max_wait=480
            local elapsed=0
            local delay=10
            until $SSH "$@" < "$stdin_file"; do
              elapsed=$((elapsed + delay))
              if [ "$elapsed" -ge "$max_wait" ]; then
                echo "SSH command did not succeed after ${max_wait}s"
                return 1
              fi
              echo "SSH command failed; retrying in ${delay}s (${elapsed}/${max_wait}s)"
              sleep "$delay"
              if [ "$delay" -lt 40 ]; then
                delay=$((delay + 10))
              fi
            done
          }

          # Verify VPS is reachable before uploading
          echo "=== Testing SSH connectivity ==="
          ssh_retry "echo 'SSH OK — disk:' && df -h /opt/petmol 2>/dev/null || df -h / | tail -2"

          # Upload zip
          echo "=== Uploading package ==="
          scp_retry /tmp/PETMOL.zip "$VPS_USER@$VPS_IP:/opt/petmol/"

          # Apply on VPS
          echo "=== Running apply script ==="
          ssh_stdin_retry deploy/sync/apply_on_vps.sh \
            "PETMOL_DEPLOY_SHA='$GIT_SHA' PETMOL_DEPLOY_BRANCH='$GIT_BRANCH' bash -s"

      - uses: actions/setup-node@v4
        if: steps.ssh_deploy.outcome == 'failure'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Build web fallback package
        if: steps.ssh_deploy.outcome == 'failure'
        env:
          GIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "SSH deploy failed; building web-only webhook fallback."
          npm ci --legacy-peer-deps
          VERSION="${GIT_SHA}-webhook-$(date -u +%s)"
          printf '{"v":"%s"}\n' "$VERSION" > apps/web/public/version.json
          npm run web:build
          tar -czf /tmp/petmol-web-standalone.tar.gz -C apps/web .next/standalone
          echo "FALLBACK_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Fallback package size: $(du -sh /tmp/petmol-web-standalone.tar.gz | cut -f1)"

      - name: Publish fallback release asset
        if: steps.ssh_deploy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          TAG="deploy-web-${GIT_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" /tmp/petmol-web-standalone.tar.gz \
            --title "Web fallback deploy ${GIT_SHA}" \
            --notes "Automatic web-only fallback deploy after SSH deploy failed."
          echo "FALLBACK_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Trigger webhook fallback deploy
        id: webhook_fallback
        if: steps.ssh_deploy.outcome == 'failure'
        run: |
          OIDC_TOKEN="$(
            curl -fsS \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=petmol-deploy" \
              | jq -r '.value'
          )"
          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "Could not obtain GitHub Actions OIDC token."
            exit 1
          fi
          curl -fsS --max-time 30 -X POST 'https://www.petmol.com.br/webhook' \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg oidcToken "$OIDC_TOKEN" '{oidcToken:$oidcToken}')"
          echo "Webhook fallback deploy requested for version ${FALLBACK_VERSION:-unknown}."

      - name: Health check
        if: steps.ssh_deploy.outcome == 'success' || steps.webhook_fallback.outcome == 'success'
        run: |
          sleep 10
          STATUS=$(curl -sL -o /dev/null -w "%{http_code}" https://petmol.com.br/api/health)
          if [[ "$STATUS" =~ ^(200|301|302|307|308)$ ]]; then
            echo "✅ Deploy successful — API responding $STATUS"
          else
            echo "❌ Health check failed — HTTP $STATUS"
            exit 1
          fi
