name: Fix VPS

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: SSH fix
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_IP" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $VPS_USER@$VPS_IP"
          
          $SSH "
            echo '=== STATUS SERVICOS ==='
            systemctl status petmol-api --no-pager -l | tail -20
            echo '=== STATUS WEB ==='
            systemctl status petmol-web --no-pager -l | tail -20
            echo '=== RESTART ==='
            systemctl restart petmol-api
            sleep 5
            systemctl restart petmol-web
            sleep 8
            echo '=== HEALTH CHECK ==='
            curl -s http://localhost:8000/health || echo 'API FAIL'
            curl -s -o /dev/null -w '%{http_code}' http://localhost:3000 || echo 'WEB FAIL'
            echo '=== JOURNAL API ==='
            journalctl -u petmol-api --since '5 minutes ago' --no-pager | tail -30
          "
