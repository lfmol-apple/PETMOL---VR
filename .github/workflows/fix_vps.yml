name: Fix VPS

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: SSH fix
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_IP" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $VPS_USER@$VPS_IP"
          
          $SSH "
            echo '=== RECLASSIFICANDO DOCUMENTOS DO BABY ==='
            cd /opt/petmol/app/services/price-service
            source .venv/bin/activate
            set -a; [ -f .env ] && source .env; set +a
            cd /opt/petmol/app
            python deploy/scripts/reclassify_pet_docs.py --pet 'Baby'
            echo '=== STATUS SERVICOS ==='
            systemctl status petmol-api --no-pager -l | tail -10
          "
