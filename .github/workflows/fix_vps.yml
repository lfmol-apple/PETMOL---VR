name: Fix VPS

on:
  workflow_dispatch:
    inputs:
      pet_name:
        description: "Nome do pet para diagnosticar"
        required: false
        default: "Baby"

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enviar scripts para o VPS
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_IP" >> ~/.ssh/known_hosts 2>/dev/null

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            deploy/scripts/diag_pet_docs.py \
            "$VPS_USER@$VPS_IP:/tmp/diag_pet_docs.py"

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            deploy/scripts/reclassify_pet_docs.py \
            "$VPS_USER@$VPS_IP:/tmp/reclassify_pet_docs.py"

      - name: Diagnostico e reclassificacao no VPS
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PET_NAME: ${{ github.event.inputs.pet_name }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $VPS_USER@$VPS_IP"

          $SSH "
            set -e
            UPLOADS='/opt/petmol/app/services/price-service/uploads/pet_documents'
            echo '=== ARQUIVOS EM uploads/pet_documents ==='
            if [ -d \"\$UPLOADS\" ]; then
              COUNT=\$(find \"\$UPLOADS\" -type f | wc -l)
              echo \"Total de arquivos: \$COUNT\"
              find \"\$UPLOADS\" -type f | head -40
            else
              echo 'DIRETORIO NAO EXISTE'
              ls -la /opt/petmol/app/services/price-service/ 2>/dev/null || true
            fi

            echo ''
            echo '=== DATABASE: documentos do pet ==='
            cd /opt/petmol/app/services/price-service
            set -a; [ -f .env ] && source .env; set +a
            .venv/bin/python /tmp/diag_pet_docs.py '$PET_NAME'

            echo ''
            echo '=== FLAG reclassify ==='
            ls -la /opt/petmol/.reclassify_baby_done 2>/dev/null || echo 'Flag NAO existe'

            echo ''
            echo '=== RECLASSIFICANDO ==='
            rm -f /opt/petmol/.reclassify_baby_done
            cd /opt/petmol/app
            /opt/petmol/app/services/price-service/.venv/bin/python /tmp/reclassify_pet_docs.py --pet '$PET_NAME'

            echo ''
            echo '=== RESULTADO APOS RECLASSIFICACAO ==='
            cd /opt/petmol/app/services/price-service
            .venv/bin/python /tmp/diag_pet_docs.py '$PET_NAME'

            echo ''
            echo '=== LOGS API (ultimas 20 linhas) ==='
            journalctl -u petmol-api --no-pager -n 20 2>/dev/null || true
          "
