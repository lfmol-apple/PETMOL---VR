name: CI

on:
  workflow_dispatch:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — typecheck + lint + build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Mirrors deploy/sync/apply_on_vps.sh exactly (root-level install, npm
      # workspaces monorepo — apps/web has no lockfile of its own, the root
      # package-lock.json covers every workspace).
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        working-directory: apps/web
        run: npx tsc --noEmit

      # 229 pre-existing warnings (mostly unused-var/exhaustive-deps) aren't
      # blocking yet — --max-warnings 0 would make this permanently red on
      # day one. Real errors (broken rules, not just style) still fail the
      # build; that's the bar this actually needs to clear.
      - name: Lint
        working-directory: apps/web
        run: npx next lint

      - name: Build
        run: npm run web:build

  backend:
    name: Backend — compile check + tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/price-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Catches real syntax/import errors across every module before deploy does.
      - name: Compile check
        run: python -m compileall -q src

      # tests/conftest.py points DATABASE_URL at a throwaway SQLite file
      # before importing the app, so this never touches Postgres/prod data.
      - name: Tests
        run: python -m pytest tests/ -v

  # Builds the one artifact that production ever runs. Everything downstream
  # (deploy/release/activate.sh on the VPS) only ever extracts and activates
  # this exact tarball — it never runs `npm ci`/`next build`/`pip install`
  # itself. Only runs on main, after both gates pass, so a PR branch never
  # produces a "deployable" package.
  package:
    name: Build & package release artifact
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Written before the build so it's baked into both the source tree
      # copy below and the standalone bundle's public/ dir.
      - name: Stamp version
        run: echo "{\"v\":\"${GITHUB_SHA}-$(date -u +%s)\"}" > apps/web/public/version.json

      - name: Build frontend (standalone)
        run: npm run web:build

      # Next's standalone output already mirrors the monorepo layout it needs
      # at runtime (apps/web/server.js + a scoped node_modules), rooted at
      # .next/standalone/ because of outputFileTracingRoot — copying its
      # contents straight into the release root recreates exactly that
      # layout, just flatter (no more nested .next/standalone/apps/web).
      - name: Assemble frontend into release root
        run: |
          mkdir -p /tmp/release
          cp -r apps/web/.next/standalone/. /tmp/release/
          mkdir -p /tmp/release/apps/web/.next
          cp -r apps/web/.next/static /tmp/release/apps/web/.next/static
          cp -r apps/web/public /tmp/release/apps/web/public

      # Source + manifest only — no .venv, no caches, no dev-only data.
      # deploy/release/activate.sh installs deps into a VPS-side shared venv
      # and symlinks it in; it is never part of this artifact.
      - name: Assemble backend into release root
        run: |
          mkdir -p /tmp/release/services/price-service
          rsync -a \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude 'uploads' \
            --exclude '.env' \
            --exclude '.env.local' \
            --exclude 'petmol.db*' \
            --exclude 'push_subscriptions.json' \
            --exclude '.pytest_cache' \
            --exclude '*.egg-info' \
            services/price-service/ /tmp/release/services/price-service/

      - name: Copy release activation scripts
        run: |
          mkdir -p /tmp/release/deploy/release /tmp/release/deploy/systemd
          cp deploy/release/activate.sh deploy/release/rollback.sh deploy/release/health_check.sh /tmp/release/deploy/release/
          cp deploy/systemd/*.service /tmp/release/deploy/systemd/
          cp deploy/systemd/*.timer /tmp/release/deploy/systemd/
          cp deploy/systemd/*.sh /tmp/release/deploy/systemd/

      - name: Write manifest
        run: |
          cat > /tmp/release/manifest.json <<EOF
          {
            "sha": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "frontend": true,
            "backend": true
          }
          EOF

      - name: Create tarball
        run: |
          # List top-level entries explicitly (not ".") so archive members
          # are named e.g. "deploy/release/activate.sh" instead of
          # "./deploy/release/activate.sh" — deploy-atomic.yml extracts a
          # single named member with `tar -xzOf ... deploy/release/activate.sh`,
          # which only matches without the leading "./".
          # node_modules/ and package.json also land at the release root —
          # Next's standalone output traces node_modules relative to the
          # monorepo root (outputFileTracingRoot), not into apps/web/, so
          # apps/web/server.js needs them here to resolve its dependencies.
          tar -czf "/tmp/petmol-${GITHUB_SHA}.tar.gz" -C /tmp/release apps services deploy manifest.json node_modules package.json
          echo "Package size: $(du -sh "/tmp/petmol-${GITHUB_SHA}.tar.gz" | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: petmol-release-${{ github.sha }}
          path: /tmp/petmol-${{ github.sha }}.tar.gz
          retention-days: 14
