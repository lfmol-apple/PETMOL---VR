name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — typecheck + lint + build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Mirrors deploy/sync/apply_on_vps.sh exactly (root-level install, npm
      # workspaces monorepo — apps/web has no lockfile of its own, the root
      # package-lock.json covers every workspace).
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        working-directory: apps/web
        run: npx tsc --noEmit

      # 229 pre-existing warnings (mostly unused-var/exhaustive-deps) aren't
      # blocking yet — --max-warnings 0 would make this permanently red on
      # day one. Real errors (broken rules, not just style) still fail the
      # build; that's the bar this actually needs to clear.
      - name: Lint
        working-directory: apps/web
        run: npx next lint

      - name: Build
        run: npm run web:build

  backend:
    name: Backend — compile check + tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/price-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Catches real syntax/import errors across every module before deploy does.
      - name: Compile check
        run: python -m compileall -q src

      # tests/conftest.py points DATABASE_URL at a throwaway SQLite file
      # before importing the app, so this never touches Postgres/prod data.
      - name: Tests
        run: python -m pytest tests/ -v
