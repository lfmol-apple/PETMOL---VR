# PETMOL — Reverse Proxy
#
# Snapshot of /etc/nginx/sites-enabled/petmol on the production VPS, captured
# 2026-08-24 via the vps-command.yml GitHub Actions workflow (SSH from the
# Actions runner, since interactive SSH to the VPS was intermittently timing
# out from this session). This file is not consumed by any deploy step — it
# exists purely for traceability/disaster-recovery, since this config only
# ever lived on the VPS itself (see docs/DEPLOYMENT.md's nginx incident
# writeup). If the VPS ever needs to be rebuilt, this is the starting point —
# but re-verify against the live config first, since it can drift after this
# snapshot and this file is not auto-synced.
#
# Porta 3000 = Next.js  |  Porta 8000 = FastAPI

limit_req_zone $binary_remote_addr zone=petmol_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=petmol_api:10m     rate=20r/s;

upstream petmol_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream petmol_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name petmol.com.br www.petmol.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 308 https://www.petmol.com.br$request_uri;
    }
}

# Legacy/unrelated domain that happens to share this VPS and cert — kept
# here faithfully as it exists in production, not a PETMOL concern.
server {
    listen 80;
    listen [::]:80;
    server_name petshopbh.com www.petshopbh.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 308 https://www.petmol.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name petmol.com.br;

    ssl_certificate     /etc/letsencrypt/live/petmol.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/petmol.com.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma        "no-cache" always;
    add_header Expires       "0" always;

    return 308 https://www.petmol.com.br$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.petmol.com.br;

    ssl_certificate     /etc/letsencrypt/live/petmol.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/petmol.com.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Auth endpoints: roteados pelo Next.js (server-side proxy para FastAPI)
    location ~* ^/api/auth/ {
        limit_req zone=petmol_general burst=40 nodelay;
        proxy_pass         http://petmol_web;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location /api/ {
        limit_req zone=petmol_api burst=40 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass         http://petmol_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        client_max_body_size  20m;
    }

    location ^~ /_next/static/ {
        proxy_pass         http://petmol_web;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        # Arquivos CSS/JS têm hash no nome — podem ser cacheados indefinidamente
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
    }

    location ^~ /uploads/pets/ {
        alias /opt/petmol/shared/uploads/pets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location ^~ /uploads/ {
        return 403;
    }

    location / {
        limit_req zone=petmol_general burst=60 nodelay;
        proxy_pass         http://petmol_web;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
    }

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name petshopbh.com www.petshopbh.com;

    ssl_certificate     /etc/letsencrypt/live/petmol.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/petmol.com.br/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 308 https://www.petmol.com.br$request_uri;
}
