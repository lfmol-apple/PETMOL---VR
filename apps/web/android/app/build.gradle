apply plugin: 'com.android.application'

// App Secret do TikTok (Android): NUNCA vai para o repositório. Vem da variável de ambiente
// PETMOL_TIKTOK_APP_SECRET ou de `petmol.tiktok.appSecret` em android/local.properties (ignorado
// pelo git). Sem ele o app compila normalmente e o SDK do TikTok simplesmente não inicia.
def tiktokAppSecret = System.getenv("PETMOL_TIKTOK_APP_SECRET") ?: ""
def localPropsFile = rootProject.file("local.properties")
if (tiktokAppSecret.isEmpty() && localPropsFile.exists()) {
    def localProps = new Properties()
    localPropsFile.withInputStream { localProps.load(it) }
    tiktokAppSecret = localProps.getProperty("petmol.tiktok.appSecret", "")
}

android {
    namespace = "br.com.petmol.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "br.com.petmol.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.2"
        buildConfigField "String", "TIKTOK_APP_SECRET", "\"${tiktokAppSecret}\""
        buildConfigField "String", "TIKTOK_APP_ID", "\"7695103016026062900\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    signingConfigs {
        release {
            // Keystore/password come from the environment, never from this
            // file or the repo — release builds without these env vars set
            // fall back to no signingConfig (an unsigned AAB, still useful
            // to validate the build itself compiles).
            def keystorePath = System.getenv("PETMOL_ANDROID_KEYSTORE_PATH")
            if (keystorePath != null) {
                storeFile file(keystorePath)
                storePassword System.getenv("PETMOL_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("PETMOL_ANDROID_KEY_ALIAS")
                keyPassword System.getenv("PETMOL_ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (System.getenv("PETMOL_ANDROID_KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // TikTok Business SDK (eventos de instalação/abertura para campanhas de app no TikTok Ads).
    // Lifecycle e Install Referrer são `compileOnly` dentro do SDK, então o app precisa trazê-los.
    implementation 'com.github.tiktok:tiktok-business-android-sdk:1.7.1'
    implementation 'androidx.lifecycle:lifecycle-process:2.3.1'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.3.1'
    implementation 'com.android.installreferrer:installreferrer:2.2'

    // Meta (Facebook) SDK: atribuição das campanhas de instalação do Meta Ads no Android.
    // Antes não havia SDK da Meta no Android (só no iOS), então nenhuma instalação era atribuída.
    implementation 'com.facebook.android:facebook-core:18.3.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
